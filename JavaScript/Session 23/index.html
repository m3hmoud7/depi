<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Bootstrap CSS  -->
    <link rel="stylesheet" href="/css/bootstrap.min.css" />
    <title>Session 23</title>
  </head>
  <body>
    <div class="container mt-12 p-12">
      <div class="row">
        <div class="md:col-10 mx-auto">
          <h2 class="text-center">Convert Dollar To Egyptian Pound</h2>
          <form id="myForm">
            <input
              type="text"
              placeholder="Enter Amount Of Dollar"
              id="dollar"
              class="form-control mt-12"
            />
            <input
              type="submit"
              value="Convert"
              class="btn-solid theme-accent d-block w-100 mt-6"
            />
          </form>
          <h5 id="result" class="mt-5"></h5>
        </div>
      </div>
    </div>
    <script src="./js/bootstrap.bundle.min.js"></script>
    <script src="./js/main.js"></script>
  </body>
</html>
